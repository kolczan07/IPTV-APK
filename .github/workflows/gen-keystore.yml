name: Gen keystore (tymczasowy)
on: workflow_dispatch
jobs:name: Gen keystore (tymczasowy)
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias iptv \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass Marcinek07 -keypass Marcinek07 \
            -dname "CN=IPTV, O=IPTV, C=PL"
          base64 -w0 release.jks
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -alias iptv \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass M@rcinek07 -keypass M@rcinek07 \
            -dname "CN=IPTV, O=IPTV, C=PL"
          base64 -w0 release.jks
